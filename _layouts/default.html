<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e5a3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#052417" media="(prefers-color-scheme: dark)">
<style>
/* Palette taken from the app's theme: felt #0E5A3A, felt dark #073D27, ivory #FBF8F0, gold #D4A93C */
:root{
  --felt:#0e5a3a;
  --felt-light:#157049;
  --felt-dark:#073d27;
  --card:#fbf8f0;
  --text:#1b1b18;
  --muted:#5f6058;
  --rule:#e8e1cf;
  --gold:#d4a93c;
  --gold-dark:#8a6a14;
  --link:#0b5534;
  --link-hover:#157049;
  --tile:#efe9d8;
  --chip:rgba(255,255,255,.12);
  --chip-on:#fbf8f0;
  --on-felt:#fbf8f0;
  --on-felt-muted:#cfe6d9;
  --shadow:0 1px 2px rgba(0,0,0,.18), 0 12px 32px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root{
    --felt:#0a3f29;
    --felt-light:#0e5a3a;
    --felt-dark:#052417;
    --card:#14201a;
    --text:#ebe7dc;
    --muted:#a3ab9f;
    --rule:#263a30;
    --gold:#d4a93c;
    --gold-dark:#e2bf62;
    --link:#8fd3ad;
    --link-hover:#d4a93c;
    --tile:#1f3127;
    --chip:rgba(255,255,255,.08);
    --chip-on:#1f3127;
    --on-felt:#fbf8f0;
    --on-felt-muted:#9fc4b1;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background-color:var(--felt);
  background-image:
    radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.wrap{max-width:46rem;margin:0 auto;padding:0 18px}

header.bar{padding:30px 0 22px;text-align:center}
header.bar .app{
  color:var(--on-felt);
  margin:0;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:-0.02em;
}
header.bar .sub{
  margin:3px 0 0;
  color:var(--gold);
  font-size:.88rem;
  letter-spacing:.01em;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}
nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:999px;
  background:var(--chip);
  color:var(--on-felt-muted);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  transition:color .15s, background .15s;
}
nav a:hover{color:var(--on-felt)}
nav a.here{
  background:var(--chip-on);
  color:var(--felt-dark);
  font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
@media (prefers-color-scheme: dark){
  nav a.here{color:var(--gold)}
}

main.card{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:38px 34px 34px;
  margin-bottom:26px;
}

main.card > :first-child{margin-top:0}
h1{font-size:1.8rem;line-height:1.25;letter-spacing:-0.025em;margin:0 0 .65em;font-weight:700;color:var(--felt-dark)}
@media (prefers-color-scheme: dark){h1{color:var(--gold)}}
h2{font-size:1.24rem;margin:2.1em 0 .5em;letter-spacing:-0.015em;font-weight:650;color:var(--felt-dark)}
@media (prefers-color-scheme: dark){h2{color:var(--on-felt)}}
h3{font-size:1.03rem;margin:1.9em 0 .4em;font-weight:650}
p,li{overflow-wrap:break-word}
li{margin:.3em 0}
a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--link-hover)}
strong{font-weight:650}
hr{border:0;border-top:1px solid var(--rule);margin:2.3em 0}

code{
  background:var(--tile);
  color:var(--text);
  padding:.14em .4em;
  border-radius:5px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

table{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:.94rem}
th,td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left}
thead th{
  background:transparent;
  color:var(--muted);
  font-weight:600;
  font-size:.86rem;
  letter-spacing:.02em;
  text-transform:uppercase;
  border-bottom:1px solid var(--rule);
}
tbody tr:last-child td{border-bottom:0}

blockquote{
  margin:1.3em 0;
  padding:.6em 0 .6em 1.1em;
  border-left:3px solid var(--gold);
  color:var(--muted);
}
blockquote p{margin:.3em 0}

footer{
  padding:4px 0 54px;
  color:var(--on-felt-muted);
  font-size:.86rem;
  text-align:center;
}
footer a{color:var(--on-felt);text-decoration:none}
footer a:hover{color:var(--gold);text-decoration:underline}
footer p{margin:.3em 0}

@media (max-width:560px){
  .wrap{padding:0 14px}
  header.bar{padding:22px 0 16px}
  main.card{padding:26px 20px 24px;border-radius:20px}
  h1{font-size:1.5rem}
  h2{font-size:1.14rem}
  nav a{padding:6px 13px;font-size:.86rem}
  table{font-size:.88rem}
  th,td{padding:8px 8px}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="bar">
    <p class="app">Hand and Foot</p>
    <p class="sub">Canasta Offline</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </header>

  <main class="card">
{{ content }}
  </main>

  <footer>
    <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
    <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
  </footer>

</div>

</body>
</html>
